<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartilha Comercial Sangfor — Guia de Vendas</title>
<meta name="theme-color" content="#1573c4" />
<meta name="description" content="Guia de vendas interativo para o time comercial Sangfor." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- Tela de abertura animada -->
<div id="splash">
  <div class="splash-inner">
    <img id="splash-logo-img" class="splash-logo-img" src="logo.png" alt="Sangfor" />
    <div class="splash-logo splash-logo-fallback">SANGFOR</div>
    <div class="splash-sub">Cartilha Comercial</div>
    <div class="splash-bar"><span></span></div>
  </div>
</div>

<!-- Fundo animado (partículas/gradiente) -->
<canvas id="bg"></canvas>
<!-- Camada de confete -->
<canvas id="confetti"></canvas>

<!-- Barra superior (app bar) -->
<header class="topbar">
  <button id="menuToggle" class="icon-btn" title="Menu" aria-label="Abrir/fechar menu">☰</button>
  <div class="brand">
    <img id="logo-img" class="logo-img" src="logo.png" alt="Sangfor" />
    <span class="logo logo-fallback">SANGFOR</span>
    <span class="tag">Cartilha Comercial · Grupo Extreme</span>
  </div>
  <input id="search" type="search" placeholder="Buscar produto, dor, objeção ou concorrente..." />
  <button id="voice" class="icon-btn" title="Busca por voz" aria-label="Busca por voz">🎙️</button>
  <button id="install" class="icon-btn" title="Instalar como aplicativo" aria-label="Instalar app" hidden>📲</button>
  <button id="pdf" class="icon-btn" title="Exportar/Imprimir esta aba em PDF" aria-label="Exportar PDF">📄</button>
  <button id="present" class="icon-btn" title="Modo apresentação (tela cheia)" aria-label="Modo apresentação">🖥️</button>
  <button id="theme" class="icon-btn" title="Alternar modo claro/escuro" aria-label="Alternar tema">🌙</button>
</header>

<div class="shell">
  <!-- Menu lateral agrupado -->
  <aside class="sidebar" id="sidebar">
    <nav id="tabs">
      <div class="nav-group">
        <div class="nav-title">Visão geral</div>
        <button class="tab active" data-view="inicio"><span class="ti">🏠</span>Início</button>
      </div>
      <div class="nav-group">
        <div class="nav-title">Ferramentas de venda</div>
        <button class="tab" data-view="recomendador"><span class="ti">🎯</span>Recomendador</button>
        <button class="tab" data-view="roi"><span class="ti">💰</span>Simulador ROI</button>
        <button class="tab" data-view="proposta"><span class="ti">📝</span>Gerar Proposta</button>
        <button class="tab" data-view="jornada"><span class="ti">🗺️</span>Linha do Tempo</button>
        <button class="tab" data-view="pitch"><span class="ti">🎤</span>Pitch Rápido</button>
      </div>
      <div class="nav-group">
        <div class="nav-title">Grupo Extreme</div>
        <button class="tab" data-view="grupo"><span class="ti">🏢</span>Grupo Extreme</button>
        <button class="tab" data-view="crosssell"><span class="ti">🔗</span>Cross-sell</button>
        <button class="tab" data-view="painel"><span class="ti">📊</span>Painel do Grupo</button>
        <button class="tab" data-view="showroom"><span class="ti">🏛️</span>Show Room Virtual</button>
      </div>
      <div class="nav-group">
        <div class="nav-title">Portfólio & argumentos</div>
        <button class="tab" data-view="produtos"><span class="ti">📦</span>Produtos</button>
        <button class="tab" data-view="catalogo"><span class="ti">🧰</span>Catálogo (Modelos)</button>
        <button class="tab" data-view="dores"><span class="ti">💢</span>Dores → Solução</button>
        <button class="tab" data-view="troca"><span class="ti">🔄</span>Trocar p/ Sangfor</button>
        <button class="tab" data-view="objecoes"><span class="ti">🛡️</span>Objeções</button>
        <button class="tab" data-view="battlecards"><span class="ti">⚔️</span>Battlecards</button>
      </div>
      <div class="nav-group">
        <div class="nav-title">Provas & diferenciais</div>
        <button class="tab" data-view="casos"><span class="ti">🏆</span>Casos de Sucesso</button>
        <button class="tab" data-view="diferenciais"><span class="ti">⭐</span>Diferenciais</button>
      </div>
      <div class="nav-group">
        <div class="nav-title">Apoio & conhecimento</div>
        <button class="tab" data-view="glossario"><span class="ti">📖</span>Glossário</button>
        <button class="tab" data-view="faq"><span class="ti">❓</span>FAQ Comercial</button>
        <button class="tab" data-view="favoritos"><span class="ti">⭐</span>Favoritos</button>
      </div>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="content">
    <div class="crumb" id="crumb"></div>
    <main id="app"></main>
    <footer class="foot">
      <p>Cartilha interna de pré-vendas · GPS IT — Grupo Extreme · Baseada em material público da Sangfor</p>
    </footer>
  </div>
</div>

<!-- Navegação inferior (mobile) -->
<nav class="bottomnav" id="bottomnav">
  <button data-view="inicio"><span>🏠</span>Início</button>
  <button data-view="recomendador"><span>🎯</span>Recomendar</button>
  <button data-view="proposta"><span>📝</span>Proposta</button>
  <button data-view="crosssell"><span>🔗</span>Cross-sell</button>
  <button data-view="produtos"><span>📦</span>Produtos</button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  /* Registra o service worker para funcionar offline (PWA).
     Só funciona quando a cartilha está hospedada em HTTPS (ex: GitHub Pages).
     Aberto direto do arquivo (file://) ele é ignorado sem erro. */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
